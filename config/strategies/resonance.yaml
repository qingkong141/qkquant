params:
  mom_window: 20
  entry_threshold: 0.03
  exit_threshold: -0.03
  drawdown_from_peak: 0.05
  max_positions: 5
  min_price: 1.0
  min_float_cap: 2000000000
  max_float_cap: 0
  min_amount: 5000000
  resonance_only: true          # 核心：必须两策略共振
  adx_threshold: 20
  cooldown_days: 20
  adx_market_filter: true
  take_profit_pct: 0.15
  time_stop_days: 0
  atr_weight: false
  chan_filter: false
  vol_confirm: false
  max_per_industry: 2
  max_pe: 0

risk:
  position_stop:
    enabled: true
    threshold: 0.08
  trailing_stop:
    enabled: true
    threshold: 0.10
  concentration:
    enabled: true
    max_weight: 0.22
  portfolio_drawdown:
    enabled: true
    threshold: 0.15
    cooldown_days: 20

universe:
  source: hs300
