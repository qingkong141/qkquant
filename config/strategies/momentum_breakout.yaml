name: momentum_breakout
description: 动量突破：mom>+5% & 距20日高<3% & 当日创10日新高才买；mom<-3% 或风控触发退出

params:
  mom_window: 20
  entry_threshold: 0.05         # 比 momentum 严：+3% → +5%
  exit_threshold: -0.03
  drawdown_from_peak: 0.03      # 距高点不超过 3%
  breakout_window: 10           # 必须创 10 日新高
  max_positions: 8
  min_price: 1.0
  min_float_cap: 2000000000    # 最小流通市值 20 亿
  max_float_cap: 0
  min_amount: 5000000          # 最小成交额 500 万
  adx_threshold: 20            # ADX 趋势过滤
  cooldown_days: 20            # 冷却期
  adx_market_filter: true      # 多头关闭 ADX
  take_profit_pct: 0.15        # 分批止盈 15%

risk:
  position_stop:
    enabled: true
    threshold: 0.08
  trailing_stop:
    enabled: true
    threshold: 0.10
  concentration:
    enabled: true
    max_weight: 0.15
  portfolio_drawdown:
    enabled: true
    threshold: 0.15
    cooldown_days: 20

universe:
  source: hs300
